<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Defense in depth: no inline script/style anywhere in the site, so the
       page needs no 'unsafe-inline'. __LAMBDA_ORIGIN__ is substituted with the
       Function URL origin by deploy.sh (left as-is, it is an unknown source
       expression that browsers ignore, so local preview degrades to 'self').
       frame-ancestors is deliberately absent: it is ignored in a <meta> CSP,
       and S3 cannot serve a custom response header. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'none';
    script-src 'self';
    style-src 'self';
    img-src 'self' blob:;
    media-src 'self' blob:;
    connect-src 'self' __LAMBDA_ORIGIN__;
    base-uri 'none';
    form-action 'self';
  ">
  <title>Cumulus</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="180x180" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="brand" href="index.html"><img src="favicon.svg" alt="" width="24" height="24"> Cumulus</a>
  </header>
  <main>
    <section id="home-view" hidden>
      <div id="login-hero">
        <div class="login-card">
          <div class="login-brand" aria-hidden="true">⛅</div>
          <h1>Partagez vos photos !</h1>
          <form id="login-form">
            <label class="sr-only" for="account-login">Login</label>
            <input id="account-login" required autocomplete="username" pattern="[a-z0-9]{2,16}"
                   title="2 à 16 caractères : lettres minuscules ou chiffres" placeholder="Login">
            <label class="sr-only" for="account-password">Mot de passe</label>
            <input id="account-password" type="password" required autocomplete="current-password"
                   placeholder="Mot de passe">
            <button type="submit">Se connecter</button>
            <p id="login-status" role="status"></p>
          </form>
        </div>
      </div>

      <section id="account-section" hidden>
        <h2 id="account-title"></h2>
        <form id="create-form" class="home-card">
          <h3>Créer un projet</h3>
          <label for="project-name">Nom du projet</label>
          <input id="project-name" required maxlength="80" placeholder="Vacances 2026">
          <button type="submit">Créer</button>
          <p id="create-status" role="status"></p>
        </form>
        <div id="create-result" class="home-card" hidden>
          <p>Projet créé ! Partagez ce lien :</p>
          <div class="share-row">
            <input id="share-link" readonly>
            <button id="copy-link" type="button">Copier</button>
          </div>
        </div>
        <section id="projects-card" class="home-card">
          <h3>Mes projets</h3>
          <ul id="server-projects"></ul>
          <p id="server-projects-empty" hidden>Aucun projet pour l'instant.</p>
        </section>
      </section>
    </section>

    <section id="project-view" hidden>
      <h1 id="project-title"></h1>
      <div id="not-found" hidden>
        <p>Projet introuvable. Vérifiez le lien qu'on vous a partagé.</p>
      </div>
      <div id="project-content">
        <button id="download-all" type="button" class="secondary" hidden>Tout télécharger</button>
        <div id="dropzone">
          <p>Glissez vos fichiers ici, ou</p>
          <div class="picker-buttons">
            <label class="button" for="photo-input">📷 Photos</label>
            <label class="button" for="file-input">📄 Fichiers</label>
          </div>
          <input id="photo-input" type="file" accept="image/*,video/*" multiple hidden>
          <input id="file-input" type="file" multiple hidden>
        </div>
        <ul id="upload-list"></ul>
        <div id="gallery"></div>
        <ul id="file-list"></ul>
        <p id="empty-state" hidden>Aucun fichier pour l'instant. Soyez le premier à en ajouter !</p>
      </div>
    </section>
  </main>

  <div id="selection-bar" hidden>
    <span id="selection-info"></span>
    <button id="select-all" type="button">Tout sélectionner</button>
    <button id="download-selected" type="button">Télécharger</button>
    <button id="clear-selection" type="button" class="secondary">Annuler</button>
  </div>

  <div id="lightbox" hidden>
    <button id="lb-close" type="button" aria-label="Fermer">✕</button>
    <button id="lb-prev" type="button" aria-label="Image précédente">‹</button>
    <img id="lb-img" alt="">
    <video id="lb-video" controls playsinline hidden></video>
    <button id="lb-next" type="button" aria-label="Image suivante">›</button>
  </div>

  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
